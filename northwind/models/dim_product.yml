version: 2

models:
  - name: dim_product
    description: Product Dimension. One row per product
    columns:
      - name: productkey
        description: The surrogate key of the product
        tests:
          - not_null
          - unique
      - name: productid
        description: The business / source key of the product
        tests:
          - not_null
          - unique
      - name: productname
        description: The name of the product
      - name: supplierkey
        description: FK to dim_supplier (snowflaked supplier dimension)
      - name: categoryname
        description: Product category name
      - name: categorydescription
        description: Product category description